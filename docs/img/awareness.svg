<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-label="awareness plugin: heads-up toasts, phase band, spec tracker and focus timer"><title>awareness plugin: heads-up toasts, phase band, spec tracker and focus timer</title><style>
:root{--bg:#ffffff;--panel:#f6f8fa;--panel2:#eaeef2;--line:#d0d7de;--text:#1f2328;--muted:#59636e;
--accent:#0969da;--accent-bg:#ddf4ff;--ok:#1a7f37;--ok-bg:#dafbe1;--warn:#9a6700;--warn-bg:#fff8c5;
--bad:#cf222e;--bad-bg:#ffebe9;--orange:#bc4c00;--orange-bg:#fff1e5}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--panel:#161b22;--panel2:#21262d;--line:#3d444d;--text:#e6edf3;--muted:#9198a1;
--accent:#58a6ff;--accent-bg:#14304f;--ok:#3fb950;--ok-bg:#12351d;--warn:#d29922;--warn-bg:#3a2d0a;
--bad:#ff7b72;--bad-bg:#45191b;--orange:#ffa657;--orange-bg:#3d2410}}
.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--line)}.panel2{fill:var(--panel2);stroke:var(--line)}
.ln{stroke:var(--line);fill:none}.lns{stroke:var(--muted);fill:none;stroke-width:1.5}
.t{font:14px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--text)}
.tb{font:600 14px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--text)}
.th{font:700 18px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--text)}
.ts{font:12px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--muted)}
.tsb{font:600 12px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--text)}
.m{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:var(--text)}
.mm{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:var(--muted)}
.cap{font:italic 12px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--muted)}
.k-n{fill:var(--panel2);stroke:var(--line)}.k-ok{fill:var(--ok-bg);stroke:var(--ok)}
.k-warn{fill:var(--warn-bg);stroke:var(--warn)}.k-bad{fill:var(--bad-bg);stroke:var(--bad)}
.k-acc{fill:var(--accent-bg);stroke:var(--accent)}.k-or{fill:var(--orange-bg);stroke:var(--orange)}
.c-ok{fill:var(--ok)}.c-warn{fill:var(--warn)}.c-bad{fill:var(--bad)}.c-acc{fill:var(--accent)}.c-or{fill:var(--orange)}.c-mu{fill:var(--muted)}
.c-line{fill:var(--line)}
</style><rect width="900" height="540" class="bg"/><rect x="20" y="14" width="860" height="386" rx="10" class="panel" />
<text x="36" y="36" class="tsb">Claude Code  ·  bento-demo</text>
<circle cx="840" cy="31" r="4.5" class="c-bad"/>
<circle cx="856" cy="31" r="4.5" class="c-warn"/>
<circle cx="872" cy="31" r="4.5" class="c-ok"/>
<line x1="20" y1="46" x2="880" y2="46" class="ln" />
<text x="36" y="66" class="ts">Heads-Up toasts (at most one per minute; text only)</text>
<rect x="36" y="76" width="640" height="36" rx="6" class="k-warn" />
<text x="50" y="99" class="m">CACHE · 60 S: Prompt cache expires soon; the next message re-caches ~$0.42.</text>
<rect x="36" y="120" width="560" height="36" rx="6" class="k-n" />
<text x="50" y="143" class="m">CONTEXT · 82%: compaction is near. Run /compact or start fresh.</text>
<rect x="36" y="164" width="700" height="36" rx="6" class="k-n" />
<text x="50" y="187" class="m">While you focused: 3 notices (cache, context, pace). Run /headsup.</text>
<text x="36" y="232" class="ts">Band row while something is active: Focus segment, then Now Doing</text>
<rect x="36" y="242" width="828" height="76" rx="6" class="panel2" />
<text x="46" y="266" class="m">FOCUS 18:42</text>
<rect x="146" y="255" width="7" height="12" rx="1.5" class="c-acc" />
<rect x="155" y="255" width="7" height="12" rx="1.5" class="c-acc" />
<rect x="164" y="255" width="7" height="12" rx="1.5" class="c-acc" />
<rect x="173" y="255" width="7" height="12" rx="1.5" class="c-line" />
<rect x="182" y="255" width="7" height="12" rx="1.5" class="c-line" />
<rect x="191" y="255" width="7" height="12" rx="1.5" class="c-line" />
<rect x="200" y="255" width="7" height="12" rx="1.5" class="c-line" />
<rect x="209" y="255" width="7" height="12" rx="1.5" class="c-line" />
<rect x="218" y="255" width="7" height="12" rx="1.5" class="c-line" />
<rect x="227" y="255" width="7" height="12" rx="1.5" class="c-line" />
<rect x="236" y="255" width="7" height="12" rx="1.5" class="c-line" />
<rect x="245" y="255" width="7" height="12" rx="1.5" class="c-line" />
<text x="264" y="266" class="mm">Focus 2 of 4 · Heads-Up quiet until 14:25</text>
<rect x="46" y="280" width="81" height="24" rx="5" class="k-ok" />
<text x="55" y="296.5" class="m">RESEARCH</text>
<rect x="135" y="280" width="49" height="24" rx="5" class="k-ok" />
<text x="144" y="296.5" class="m">PLAN</text>
<rect x="192" y="280" width="57" height="24" rx="5" class="k-acc" />
<text x="201" y="296.5" class="m">BUILD</text>
<rect x="257" y="280" width="65" height="24" rx="5" class="k-n" />
<text x="266" y="296.5" class="m">VERIFY</text>
<rect x="330" y="280" width="65" height="24" rx="5" class="k-n" />
<text x="339" y="296.5" class="m">REPORT</text>
<text x="409" y="297" class="m">now: Editing register.tsx</text>
<text x="636.4" y="297" class="m">SPEC 7/12</text>
<text x="36" y="342" class="ts">Chips: visited, current, not yet visited. The Spec Tracker segment also shows  next: &lt;first unchecked item&gt;.</text>
<text x="36" y="362" class="ts">While a long command runs the band shows a timer, for example  ⏱ npm 01:42.</text>
<text x="24" y="528" class="cap">Illustration — not a screenshot</text>
<text x="24" y="428" class="tsb">Commands</text>
<rect x="24" y="438" width="136" height="24" rx="5" class="k-acc" />
<text x="33" y="454.5" class="m">/focus start 25</text>
<rect x="168" y="438" width="247" height="24" rx="5" class="k-acc" />
<text x="177" y="454.5" class="m">/focus pause|resume|stop|skip</text>
<rect x="423" y="438" width="152" height="24" rx="5" class="k-acc" />
<text x="432" y="454.5" class="m">/headsup mute 30m</text>
<rect x="583" y="438" width="168" height="24" rx="5" class="k-acc" />
<text x="592" y="454.5" class="m">/headsup test cache</text>
<rect x="24" y="470" width="112" height="24" rx="5" class="k-acc" />
<text x="33" y="486.5" class="m">/spec &lt;path&gt;</text>
<rect x="144" y="470" width="104" height="24" rx="5" class="k-acc" />
<text x="153" y="486.5" class="m">/spec clear</text>
<rect x="256" y="470" width="89" height="24" rx="5" class="k-acc" />
<text x="265" y="486.5" class="m">/nowdoing</text>
<rect x="353" y="470" width="136" height="24" rx="5" class="k-acc" />
<text x="362" y="486.5" class="m">/nowdoing reset</text>
<rect x="497" y="470" width="136" height="24" rx="5" class="k-acc" />
<text x="506" y="486.5" class="m">/headsup status</text></svg>

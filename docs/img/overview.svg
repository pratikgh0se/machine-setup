<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="How Bento fits together"><title>How Bento fits together</title><style>
:root{--bg:#ffffff;--panel:#f6f8fa;--panel2:#eaeef2;--line:#d0d7de;--text:#1f2328;--muted:#59636e;
--accent:#0969da;--accent-bg:#ddf4ff;--ok:#1a7f37;--ok-bg:#dafbe1;--warn:#9a6700;--warn-bg:#fff8c5;
--bad:#cf222e;--bad-bg:#ffebe9;--orange:#bc4c00;--orange-bg:#fff1e5}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--panel:#161b22;--panel2:#21262d;--line:#3d444d;--text:#e6edf3;--muted:#9198a1;
--accent:#58a6ff;--accent-bg:#14304f;--ok:#3fb950;--ok-bg:#12351d;--warn:#d29922;--warn-bg:#3a2d0a;
--bad:#ff7b72;--bad-bg:#45191b;--orange:#ffa657;--orange-bg:#3d2410}}
.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--line)}.panel2{fill:var(--panel2);stroke:var(--line)}
.ln{stroke:var(--line);fill:none}.lns{stroke:var(--muted);fill:none;stroke-width:1.5}
.t{font:14px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--text)}
.tb{font:600 14px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--text)}
.th{font:700 18px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--text)}
.ts{font:12px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--muted)}
.tsb{font:600 12px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--text)}
.m{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:var(--text)}
.mm{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:var(--muted)}
.cap{font:italic 12px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--muted)}
.k-n{fill:var(--panel2);stroke:var(--line)}.k-ok{fill:var(--ok-bg);stroke:var(--ok)}
.k-warn{fill:var(--warn-bg);stroke:var(--warn)}.k-bad{fill:var(--bad-bg);stroke:var(--bad)}
.k-acc{fill:var(--accent-bg);stroke:var(--accent)}.k-or{fill:var(--orange-bg);stroke:var(--orange)}
.c-ok{fill:var(--ok)}.c-warn{fill:var(--warn)}.c-bad{fill:var(--bad)}.c-acc{fill:var(--accent)}.c-or{fill:var(--orange)}.c-mu{fill:var(--muted)}
.c-line{fill:var(--line)}
</style><rect width="1000" height="640" class="bg"/><text x="24" y="34" class="th">How the pieces fit</text>
<rect x="24" y="70" width="250" height="250" rx="10" class="k-acc" />
<text x="149" y="108" class="th" text-anchor="middle">Claude Code</text>
<text x="149" y="132" class="t" text-anchor="middle">your sessions, in the</text>
<text x="149" y="150" class="t" text-anchor="middle">terminal or desktop app</text>
<text x="149" y="192" class="ts" text-anchor="middle">Plugins draw the UI.</text>
<text x="149" y="210" class="ts" text-anchor="middle">Hooks run on compaction</text>
<text x="149" y="228" class="ts" text-anchor="middle">and on risky commands.</text>
<rect x="330" y="70" width="646" height="190" rx="10" class="panel" />
<text x="346" y="98" class="tb">6 plugins  (marketplace: bento)</text>
<text x="346" y="116" class="ts">UI only: panes, bands, toasts, commands. No model calls; near-zero tokens.</text>
<rect x="346" y="132" width="196" height="48" rx="6" class="k-n" />
<text x="356" y="152" class="tb">safety</text>
<text x="356" y="169" class="ts">protected files, checkpoints</text>
<rect x="554" y="132" width="196" height="48" rx="6" class="k-n" />
<text x="564" y="152" class="tb">usage</text>
<text x="564" y="169" class="ts">limits, cache clock, context</text>
<rect x="762" y="132" width="196" height="48" rx="6" class="k-n" />
<text x="772" y="152" class="tb">awareness</text>
<text x="772" y="169" class="ts">toasts, phase, focus timer</text>
<rect x="346" y="190" width="196" height="48" rx="6" class="k-n" />
<text x="356" y="210" class="tb">agents</text>
<text x="356" y="227" class="ts">pets, delegation guard, mission</text>
<rect x="554" y="190" width="196" height="48" rx="6" class="k-n" />
<text x="564" y="210" class="tb">dev</text>
<text x="564" y="227" class="ts">git, tests, coverage, PRs</text>
<rect x="762" y="190" width="196" height="48" rx="6" class="k-n" />
<text x="772" y="210" class="tb">compact</text>
<text x="772" y="227" class="ts">coach, /handoff, nudge</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="c-mu"/></marker></defs>
<line x1="274" y1="165" x2="330" y2="165" class="lns" marker-start="url(#a)" marker-end="url(#a)"/>
<rect x="24" y="356" width="400" height="112" rx="10" class="k-or" />
<text x="40" y="384" class="tb">Machine hooks  (handoff)</text>
<text x="40" y="404" class="ts">PreCompact: write the handoff.  SessionStart: inject it.</text>
<text x="40" y="422" class="ts">Guards: no git stash, no scans from / or home.</text>
<text x="40" y="440" class="ts">Plain scripts in ~/.claude/hooks.</text>
<line x1="149" y1="356" x2="149" y2="320" class="lns" marker-end="url(#a)"/>
<rect x="24" y="504" width="640" height="100" rx="10" class="panel" />
<text x="40" y="530" class="tb">launchd jobs  (macOS, optional)</text>
<rect x="40" y="542" width="196" height="52" rx="6" class="k-n" />
<text x="50" y="561" class="tsb">handoff canary  ·  daily 03:30</text>
<text x="50" y="580" class="ts">proves the handoff chain works</text>
<rect x="248" y="542" width="196" height="52" rx="6" class="k-n" />
<text x="258" y="561" class="tsb">token-budget  ·  Mondays 09:00</text>
<text x="258" y="580" class="ts">weekly overhead and spend report</text>
<rect x="456" y="542" width="196" height="52" rx="6" class="k-n" />
<text x="466" y="561" class="tsb">autosync  ·  daily 21:00</text>
<text x="466" y="580" class="ts">export and commit locally</text>
<line x1="344" y1="504" x2="344" y2="468" class="lns" marker-end="url(#a)"/>
<text x="354" y="490" class="ts">canary drives headless sessions through a compaction</text>
<rect x="716" y="330" width="260" height="112" rx="10" class="k-ok" />
<text x="732" y="358" class="tb">Public repo</text>
<text x="732" y="378" class="m">machine-setup</text>
<text x="732" y="400" class="ts">plugins, hooks, scripts, templates,</text>
<text x="732" y="416" class="ts">docs. Nothing personal.</text>
<rect x="716" y="474" width="260" height="112" rx="10" class="k-warn" />
<text x="732" y="502" class="tb">Private overlay</text>
<text x="732" y="522" class="m">machine-setup-private</text>
<text x="732" y="544" class="ts">your settings, repo lists, personal</text>
<text x="732" y="560" class="ts">jobs. Merged over the public files.</text>
<line x1="846" y1="474" x2="846" y2="442" class="lns" marker-start="url(#a)"/>
<text x="856" y="462" class="ts">overlay on top</text>
<line x1="664" y1="566" x2="716" y2="540" class="lns" marker-end="url(#a)"/>
<line x1="664" y1="540" x2="716" y2="400" class="lns" marker-end="url(#a)"/>
<text x="676" y="612" class="ts">autosync commits both repos; the public push waits for</text>
<text x="676" y="628" class="ts">you: setup/publish.sh, review, then --push</text>
<rect x="696" y="292" width="0" height="0" rx="6" class="bg" />
<text x="716" y="318" class="ts">bootstrap installs all of this on a new Mac</text>
<text x="24" y="628" class="cap">Illustration — not a screenshot</text></svg>
